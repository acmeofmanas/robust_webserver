[server]
host       = 0.0.0.0
port       = 8000
dir        = /data/
# Chunk size in KB for streaming large files
chunk_size = 1024

[ssl]
enabled       = false
cert          = ./server.crt
key           = ./server.key
# Set to true to auto-generate a self-signed cert on startup
generate_cert = false

[logging]
log_dir = ./logs
quiet   = false
